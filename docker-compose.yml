services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: leadsight
      POSTGRES_PASSWORD: leadsight
      POSTGRES_DB: leadsight
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadsight"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: {}
